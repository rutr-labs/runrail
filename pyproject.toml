[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runrail"
version = "0.3.1"
description = "A self-hosted workflow orchestrator for the Python scripts, notebooks, SQL, and shell commands you already have."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{ name = "Rutr Labs", email = "therutr@outlook.com" }]
maintainers = [{ name = "Rutr Labs", email = "therutr@outlook.com" }]
keywords = [
  "workflow", "orchestration", "orchestrator", "scheduler", "cron",
  "data-engineering", "etl", "elt", "pipelines", "jobs", "dag",
  "airflow-alternative", "self-hosted", "notebooks", "papermill",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Monitoring",
  "Topic :: Office/Business :: Scheduling",
  "Framework :: FastAPI",
  "Environment :: Web Environment",
  "Typing :: Typed",
]
dependencies = [
  "alembic>=1.13", "apscheduler>=3.10,<4", "fastapi>=0.115", "jinja2>=3.1",
  "platformdirs>=4", "psycopg[binary]>=3.2", "pydantic-settings>=2.5",
  "pyyaml>=6.0", "sqlalchemy>=2.0", "typer>=0.12", "uvicorn[standard]>=0.30"
]

[project.optional-dependencies]
notebook = ["papermill>=2.6", "nbconvert>=7.16"]
dev = ["build>=1.2", "httpx>=0.27", "pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/rutr-labs/runrail"
Repository = "https://github.com/rutr-labs/runrail"
Documentation = "https://github.com/rutr-labs/runrail#readme"
Issues = "https://github.com/rutr-labs/runrail/issues"
Changelog = "https://github.com/rutr-labs/runrail/blob/main/CHANGELOG.md"

[project.scripts]
runrail = "runrail.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/runrail"]
# Force the prebuilt React bundle into the wheel so the UI works with no npm
# at runtime, even if build output is ever gitignored.
artifacts = ["src/runrail/web/static/**"]

[tool.hatch.build.targets.sdist]
include = ["src/runrail/**/*", "README.md", "CHANGELOG.md", "LICENSE"]
artifacts = ["src/runrail/web/static/**"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "E701", "E702", "UP017"]

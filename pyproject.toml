[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runrail"
version = "0.1.0"
description = "A lightweight, self-hosted workflow control plane for existing data jobs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "alembic>=1.13", "apscheduler>=3.10,<4", "fastapi>=0.115", "jinja2>=3.1",
  "psycopg[binary]>=3.2", "pydantic-settings>=2.5", "sqlalchemy>=2.0",
  "typer>=0.12", "uvicorn[standard]>=0.30"
]

[project.optional-dependencies]
notebook = ["papermill>=2.6", "nbconvert>=7.16"]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.6"]

[project.scripts]
runrail = "runrail.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/runrail"]

[tool.hatch.build]
include = ["src/runrail/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "E701", "E702", "UP017"]

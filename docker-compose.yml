services:
  runrail:
    build: .
    ports: ["8080:8080"]
    environment:
      RUNRAIL_DB_URL: postgresql+psycopg://runrail:runrail@postgres:5432/runrail
      RUNRAIL_HOME: /data
    volumes:
      - runrail-data:/data
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: runrail
      POSTGRES_PASSWORD: runrail
      POSTGRES_DB: runrail
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runrail"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  runrail-data:
  postgres-data:


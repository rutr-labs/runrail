name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest -q

  # PostgreSQL is a shipped, documented configuration (RUNRAIL_DB_URL, and the
  # database docker-compose starts), so the same suite has to run against a real
  # server: sa.Enum is a native type there and a bare VARCHAR on SQLite, and
  # timestamptz keeps the offset SQLite drops. One job, not a second axis on the
  # Python matrix — the dialect is what is under test here, not the interpreter.
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: runrail
          POSTGRES_PASSWORD: runrail
          POSTGRES_DB: runrail
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # conftest points every test at this; init_db runs the migration chain, so
      # the dialect-specific branches (ALTER TYPE ADD VALUE, CREATE TYPE lockmode)
      # are exercised rather than skipped by a create_all shortcut. Deliberately
      # its own variable: the suite TRUNCATEs between tests, and reusing
      # RUNRAIL_DB_URL would let `pytest` empty a developer's real database.
      RUNRAIL_TEST_DB_URL: postgresql+psycopg://runrail:runrail@localhost:5432/runrail
      # The same URL again, for the settings read at collection time — a test
      # that is SQLite-only (EXPLAIN QUERY PLAN) decides whether to skip before
      # any fixture has run.
      RUNRAIL_DB_URL: postgresql+psycopg://runrail:runrail@localhost:5432/runrail
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Typecheck and build
        run: npm run build
        working-directory: frontend
      # After the build: a broken shipped bundle should fail before test detail.
      - name: Tests
        run: npm test
        working-directory: frontend

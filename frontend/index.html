<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Served from frontend/public, which Vite copies verbatim into the
       built bundle, so the wheel ships it. -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="theme-color" content="#09090f" />
  <title>RunRail — Control Plane</title>
  <script>
    // Apply theme before render to prevent flash; ?theme= overrides for captures
    const stored = new URLSearchParams(location.search).get('theme')
      || localStorage.getItem('runrail-theme');
    const system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = stored || system || 'dark';
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
